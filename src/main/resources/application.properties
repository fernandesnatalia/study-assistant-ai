# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/study_assistant
spring.datasource.username=study_user
spring.datasource.password=study_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.chat.options.temperature=0.2

# JWT
app.jwt.secret=study-assistant-ai-development-secret-key-2026
app.jwt.expiration=86400000