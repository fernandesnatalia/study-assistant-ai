services:
  postgres:
    image: postgres:17
    container_name: study-assistant-db
    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: study_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: